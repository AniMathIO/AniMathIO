[package]
name = "animathio-render"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
animathio-media = { path = "../media" }
animathio-core.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
parley = { version = "0.12", default-features = false, features = ["std"] }
vello_cpu = { version = "0.4", default-features = false, features = ["std", "text", "u8_pipeline"] }
thiserror.workspace = true
# Keep CPU reference frames independent of the host SIMD feature set.
fearless_simd = { version = "1.2", features = ["force_support_fallback"] }
# Optional GPU preview backend (Vello compute on wgpu). CPU stays the reference.
vello = { version = "0.12", optional = true }
pollster = { version = "0.4", optional = true }

[features]
gpu = ["dep:vello", "dep:pollster"]

[dev-dependencies]
animathio-format = { path = "../format" }
proptest.workspace = true

[lints]
workspace = true
