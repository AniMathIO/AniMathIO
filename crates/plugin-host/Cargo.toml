[package]
name = "animathio-plugin-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "WebAssembly Component Model plugin host runtime and registry for AniMathIO 2.0"

[dependencies]
animathio-core = { workspace = true }
animathio-plugin-api = { path = "../plugin-api" }
wasmtime = { version = "50.0.1", features = ["component-model"] }
wasmtime-wasi = "50.0.1"
skrifa = "0.49.0"
kurbo = "0.13.1"
blake3 = { version = "1.8", default-features = false }
lru = "0.19.0"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = "0.4"
tempfile = "3"

[dev-dependencies]
animathio-core = { workspace = true }
animathio-plugin-api = { path = "../plugin-api" }
serde_json = { workspace = true }
wat = "1"
