[package]
name = "animathio-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
animathio-export = { path = "../../crates/export" }
animathio-control = { path = "../../crates/control" }
animathio-core.workspace = true
animathio-format = { path = "../../crates/format" }
animathio-import-v1 = { path = "../../crates/import-v1" }
animathio-import-manim = { path = "../../crates/import-manim" }
animathio-render = { path = "../../crates/render" }
clap = { version = "4.5", features = ["derive"] }
rmcp = { version = "3.9", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
tempfile = "3"

[lints]
workspace = true

# cargo-packager configuration. Installers are built and smoke-tested by
# .github/workflows/package.yml (Linux: AppImage + deb; Windows: NSIS).
#
# TODO(animathio): when `apps/animathio` (the GPUI desktop app) lands, move a
# copy of this table to apps/animathio/Cargo.toml so the installer ships the
# desktop app (and update package.yml to package + smoke-test `animathio`):
#
#   [package.metadata.packager]
#   before-packaging-command = "cargo build --release --locked -p animathio"
#   product-name = "AniMathIO"
#   identifier = "org.animathio.animathio"
#   out-dir = "target/packages"
#   icons = ["../../assets/icons/icon.png"]  # add an icon asset first
#
[package.metadata.packager]
before-packaging-command = "cargo build --release --locked -p animathio-cli"
product-name = "animathio-cli"
identifier = "org.animathio.cli"
out-dir = "target/packages"
