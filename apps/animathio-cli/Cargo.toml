[package]
name = "animathio-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Link the whisper.cpp speech engine so `transcribe` and the `auto_subtitles` MCP tool can run
# (needs cmake, a C++ toolchain and libclang to build). Without it they report that this
# build has no engine; model downloads and subtitle import/export still work.
whisper = ["animathio-control/whisper"]

[dependencies]
animathio-transcribe = { path = "../../crates/transcribe" }
animathio-plugin-host = { path = "../../crates/plugin-host" }
directories = "6"
animathio-plugin-api = { path = "../../crates/plugin-api" }

animathio-media = { path = "../../crates/media" }
animathio-export = { path = "../../crates/export" }
animathio-control = { path = "../../crates/control" }
animathio-core.workspace = true
animathio-format = { path = "../../crates/format" }
animathio-import-v1 = { path = "../../crates/import-v1" }
animathio-render = { path = "../../crates/render" }
clap = { version = "4.5", features = ["derive"] }
rmcp = { version = "3.9", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }

[dev-dependencies]
animathio-plugin-host = { path = "../../crates/plugin-host", features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
tempfile = "3"

[lints]
workspace = true

# Packaging lives in `apps/animathio` (see its `[package.metadata.packager]`):
# the single AniMathIO installer ships both the editor and this CLI, and
# .github/workflows/package.yml smoke-tests `animathio-cli --version` from the
# installed package.
