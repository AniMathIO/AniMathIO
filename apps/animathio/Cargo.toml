[package]
name = "animathio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
animathio-export = { path = "../../crates/export" }
animathio-core.workspace = true
animathio-control = { path = "../../crates/control" }
animathio-format = { path = "../../crates/format" }
animathio-import-v1 = { path = "../../crates/import-v1" }
animathio-render = { path = "../../crates/render" }
animathio-audio = { path = "../../crates/audio" }
animathio-plugin-api = { path = "../../crates/plugin-api" }
animathio-plugin-host = { path = "../../crates/plugin-host" }
base64 = "0.22"
directories = "6"
gpui.workspace = true
gpui-component.workspace = true
gpui-platform.workspace = true
image = { version = "0.25", default-features = false }
rfd.workspace = true
serde_json.workspace = true

[lints]
workspace = true

# The canonical desktop package. Installers are built and smoke-tested by
# .github/workflows/package.yml (Linux: AppImage + deb; Windows: NSIS).
[package.metadata.packager]
before-packaging-command = "cargo build --release --locked -p animathio"
product-name = "AniMathIO"
identifier = "org.animathio.animathio"
out-dir = "target/packages"
