[package]
name = "animathio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
animathio-core.workspace = true
animathio-format = { path = "../../crates/format" }
animathio-render = { path = "../../crates/render" }
animathio-audio = { path = "../../crates/audio" }
gpui.workspace = true
image = { version = "0.25", default-features = false }
rfd.workspace = true
directories = "6"
serde_json.workspace = true

[lints]
workspace = true

# The canonical desktop package. Installers are built and smoke-tested by
# .github/workflows/package.yml (Linux: AppImage + deb; Windows: NSIS).
[package.metadata.packager]
before-packaging-command = "cargo build --release --locked -p animathio"
product-name = "AniMathIO"
identifier = "org.animathio.animathio"
out-dir = "target/packages"
