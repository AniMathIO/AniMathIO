name: Fuzz

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [project_json, project_amio, v1_import, manim_source, media_probe]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz
      - name: Run fuzz target for 60 s
        run: nice -n 19 cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=60
