name: Security Audit

# Daily RustSec advisory check. Uses cargo-deny once `deny.toml` lands (added in
# the media PR), and falls back to `cargo audit` until then.
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: RustSec advisories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Check advisories (cargo-deny if deny.toml exists, else cargo audit)
        run: |
          if [ -f deny.toml ]; then
            cargo install cargo-deny
            cargo deny check advisories
          else
            cargo install cargo-audit
            cargo audit
          fi
