name: Rust CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Dispatched by flatpak-sources.yml after its GITHUB_TOKEN push (which starts
  # no workflows) so the required `check` contexts report on the new head.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      # Run both OSes to completion so a failure on one never hides the other.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Allow room for the capped steps, setup and post-job cleanup.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 210 || 150 }}
    # Renovate rebases can push the same branch repeatedly while earlier runs
    # are still going; each superseded run wasted a full runner and raced the
    # rust-cache save ("another job may be creating this cache"), which is how
    # the 2026-11-22 cache-miss cascade started. Cancel superseded runs, but
    # never a run on main (a push there is already sequential).
    concurrency:
      group: ci-check-${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/main') }}
    env:
      CARGO_BUILD_JOBS: 3
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      # Full history so the docs-only detection below can diff a pull request or
      # push against its base commit (base object plus common history).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Docs-only changes skip the whole Rust pipeline; the required `check`
      # contexts still report success on every PR because the job itself runs.
      # Keep the matrix and job name unchanged: they own the required checks.
      - name: Detect docs-only changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          base='' head=''
          case "$EVENT_NAME" in
            pull_request) base="$BASE_SHA"; head="$HEAD_SHA" ;;
            push)         head="$GITHUB_SHA"; [[ "$BEFORE_SHA" == "$zero" ]] || base="$BEFORE_SHA" ;;
          esac

          full_run() {
            echo "full checks: ${*:-unspecified reason}"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          # A new branch (all-zero `before`), a force push or a missing base
          # object has no reliable base commit; run the full checks.
          [[ -n "$base" ]] || full_run 'no base commit (new branch or unsupported event)'
          git cat-file -e "$base^{commit}" 2>/dev/null || full_run "base commit $base is not present locally (force-pushed away?)"
          if [[ "$EVENT_NAME" == push ]]; then
            git merge-base --is-ancestor "$base" "$head" 2>/dev/null || full_run "base commit $base is not an ancestor of the pushed commit (force push)"
          fi
          # --no-renames so a renamed path also lists its old name: a code file
          # renamed to .md must not slip onto the fast path via the new name alone.
          changed=$(git diff --name-only --no-renames "$base...$head" 2>/dev/null) || full_run 'diff against the base commit failed'

          # Docs-only = every changed path is documentation. Why each pattern is
          # safe to skip the Rust build for:
          #   *.md                            Markdown anywhere (README, AGENTS, docs/*.md, ...)
          #   docs/* except docs/plugins.md   prose, benchmark data and screenshots;
          #     the exception is a test fixture: crates/plugin-api/tests/api.rs
          #     embeds docs/plugins.md verbatim and asserts on it under cargo test
          #   LICENSE*                        root license texts
          #   .github/ISSUE_TEMPLATE/*        issue form templates
          #   .github/PULL_REQUEST_TEMPLATE*  pull request templates (file or directory)
          docs_only=true
          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            case "$path" in
              docs/plugins.md) docs_only=false ;;
              docs/*) ;;
              *.md) ;;
              LICENSE*) ;;
              .github/ISSUE_TEMPLATE/*) ;;
              .github/PULL_REQUEST_TEMPLATE*|.github/pull_request_template*) ;;
              *) docs_only=false ;;
            esac
          done <<<"$changed"

          if [[ "$docs_only" == true ]]; then
            echo 'docs-only change; running the docs checks only:'
          else
            echo 'not docs-only; running the full checks:'
          fi
          printf '%s\n' "$changed"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
      # Fast path: validate the docs against the sources without building the
      # CLI. Without --require-binary the script skips the `--help` block
      # comparison (it notes that it checks subcommand names against main.rs
      # instead) but still checks paths, links, anchors, MCP tools, control
      # methods, environment variables, plugin ids, commands, WIT items and
      # Rust symbols against the code.
      - name: Check docs (docs-only fast path)
        if: steps.changes.outputs.docs_only == 'true' && runner.os == 'Linux'
        run: scripts/check-docs.sh
      # The nested workspaces that path-depend on workspace crates (fuzz/,
      # plugins/import-manim/) keep their own Cargo.lock files; a hand-made
      # version bump leaves them stale and breaks their --locked builds. Fail
      # fast with the fix command (release-plz.yml syncs release PRs
      # automatically; this guards everything else). Release-plz branches are
      # exempt: their lockfiles are stale by construction until the sync
      # commit lands a minute later, and a failing check there would only add
      # noise to the PR's first CI run.
      - name: Sub-workspace lockfiles
        if: runner.os == 'Linux' && steps.changes.outputs.docs_only != 'true' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-plz-'))
        run: scripts/sync-sub-lockfiles.sh --check
      # The offline Flatpak build vendors every crate from
      # packaging/flatpak/cargo-sources.json, so a lockfile change (a Renovate
      # bump, a new dependency) without regenerating it breaks that build only
      # when the slow Flatpak workflow next runs. Compare the file with every
      # lockfile on each non-docs run (lockfiles are never docs-only changes);
      # the fix command is printed on failure. Needs only python3.
      - name: Flatpak cargo sources
        if: runner.os == 'Linux' && steps.changes.outputs.docs_only != 'true'
        run: python3 scripts/check-flatpak-sources.py
      - name: Install Linux development headers
        if: runner.os == 'Linux' && steps.changes.outputs.docs_only != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfontconfig-dev \
            libwayland-dev \
            libvulkan-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-xkb-dev \
            libxcb-randr0-dev \
            libxcb-render0-dev \
            libxcb-xinput-dev \
            libxcb-sync-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            ffmpeg \
            python3-pil \
            cmake \
            libclang-dev \
            pkg-config
      - name: Install stable toolchain
        if: steps.changes.outputs.docs_only != 'true'
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Install wasm32-wasip2 target
        if: steps.changes.outputs.docs_only != 'true'
        run: rustup target add wasm32-wasip2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.changes.outputs.docs_only != 'true'
        with:
          workspaces: .
          # PRs restore only. A failed run on main can still save compiled
          # dependencies for the next run if the post-job step executes.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Build plugins
        if: steps.changes.outputs.docs_only != 'true'
        shell: bash
        run: ./scripts/build-plugins.sh
      - name: Build plugin authoring example
        if: steps.changes.outputs.docs_only != 'true'
        run: cargo build --manifest-path plugins/examples/hello/Cargo.toml --target wasm32-wasip2 --release --locked
      # plugins/text is its own Cargo workspace, so `cargo test --workspace` never runs its
      # unit tests (glyph fallback, wrapping, limits). They compile natively: the wasm
      # host imports are only called by render_clip, which these tests do not reach.
      - name: Text plugin unit tests
        if: steps.changes.outputs.docs_only != 'true'
        run: cargo test --manifest-path plugins/text/Cargo.toml --locked --target-dir target/plugin-tests
      - name: Check formatting
        if: steps.changes.outputs.docs_only != 'true'
        run: cargo fmt --all --check
      # Run 45050614020 measured Windows Tests at 56 min on a cold cache.
      # Ubuntu Tests reached 43 min on a cold cache.
      - name: Clippy
        timeout-minutes: 25
        if: steps.changes.outputs.docs_only != 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        timeout-minutes: ${{ runner.os == 'Windows' && 85 || 65 }}
        if: steps.changes.outputs.docs_only != 'true'
        run: cargo test --workspace --locked --no-fail-fast
      # The whisper.cpp speech engine (cargo feature `whisper`) needs cmake, a C++ toolchain and
      # libclang, so it is not part of the default workspace build. Build, lint and test it
      # here on both OSes; the model-backed test is #[ignore]d, CI never downloads a model.
      # The Windows step took about 33.5 min on a cold cache in run 45050614020.
      - name: Speech engine (whisper feature)
        timeout-minutes: 30
        if: runner.os == 'Linux' && steps.changes.outputs.docs_only != 'true'
        run: |
          cargo clippy -p animathio-transcribe -p animathio-cli --features animathio-transcribe/whisper,animathio-cli/whisper --all-targets --locked -- -D warnings
          cargo test -p animathio-transcribe --features whisper --locked
      - name: Speech engine (whisper feature, Windows)
        timeout-minutes: 51
        if: runner.os == 'Windows' && steps.changes.outputs.docs_only != 'true'
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: |
          cargo build -p animathio-cli --features whisper --locked
          cargo test -p animathio-transcribe --features whisper --locked
      - name: Check docs against the code
        if: runner.os == 'Linux' && steps.changes.outputs.docs_only != 'true'
        run: |
          cargo build -p animathio-cli --locked
          scripts/check-docs.sh --require-binary
      - name: Showcase offline E2E
        timeout-minutes: 15
        if: runner.os == 'Linux' && steps.changes.outputs.docs_only != 'true'
        env:
          ANIMATHIO_PLUGIN_DIR: ${{ github.workspace }}/target/plugins
        # Use the interpreter that owns apt's python3-pil, independent of runner PATH.
        run: /usr/bin/python3 examples/showcase/test.py --output target/showcase-e2e
      - name: Upload failed showcase renders
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: showcase-e2e-failure
          path: target/showcase-e2e
          if-no-files-found: ignore
      # Licenses cannot change in a docs-only PR (Cargo.lock/Cargo.toml are
      # never in the docs-only set), so this is skipped on the fast path too.
      - name: Check licenses
        if: runner.os == 'Linux' && steps.changes.outputs.docs_only != 'true'
        uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2
        with:
          command: check licenses
