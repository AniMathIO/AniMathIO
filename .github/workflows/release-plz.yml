name: Release Plz

# Opens/updates the release PR (version bump + changelog) on every push to v2.
# Releases themselves stay disabled until the 2.0 swap: see release-plz.toml.
on:
  push:
    branches: [v2]

permissions:
  contents: write # push the release-plz branch + commits
  pull-requests: write # open/update the release PR

jobs:
  release-plz:
    name: Open release PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Open or update release PR
        uses: release-plz/action@f36720ba01927d9927fba665fcdf802e12bc264b # v0.5.147
        with:
          command: release-pr
          version: "0.4.3"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Releases are disabled until the 2.0 swap (see release-plz.toml).
  # To enable, uncomment this job after flipping git_tag_enable/git_release_enable:
  #
