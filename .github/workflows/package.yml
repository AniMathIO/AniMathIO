name: Package

# Builds + smoke-tests installers for the canonical package.
#
# Runs:
#   * manually (workflow_dispatch), and
#   * on release-plz release PRs (branches named `release-plz-*`), so every
#     release PR proves the installers build, install/extract and run before
#     the release is merged.
#
# TODO(animathio): once `apps/animathio` (the GPUI desktop app) lands, switch
# the packaging target below from `animathio-cli` to `animathio` and smoke-test
# `animathio --version`. See also the commented config block in
# apps/animathio-cli/Cargo.toml.

on:
  workflow_dispatch:
  pull_request:
    branches: [v2]

permissions:
  contents: read
  id-token: write # for build provenance attestations
  attestations: write

concurrency:
  group: package-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    # Only package on manual dispatch or on release-plz release PRs.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release-plz')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            formats: appimage,deb
            subject: |
              target/packages/*.AppImage
              target/packages/*.deb
          - os: windows-latest
            formats: nsis
            subject: |
              target/packages/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Install cargo-packager
        run: cargo install cargo-packager@0.11.8
      - name: Build and package installers
        run: cargo packager --release --packages animathio-cli --formats ${{ matrix.formats }}
      - name: Smoke test installers (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          # AppImage: self-extract (no FUSE needed) and run the embedded binary.
          appimage="$(find target/packages -maxdepth 1 -name '*.AppImage' -print -quit)"
          chmod +x "$appimage"
          "$appimage" --appimage-extract >/dev/null
          appimage_bin="$(find squashfs-root -type f -name 'animathio-cli' -print -quit)"
          "$appimage_bin" --version

          # deb: extract and run the binary.
          deb="$(find target/packages -maxdepth 1 -name '*.deb' -print -quit)"
          mkdir -p deb-root
          dpkg-deb -x "$deb" deb-root
          deb_bin="$(find deb-root -type f -name 'animathio-cli' -print -quit)"
          "$deb_bin" --version
      - name: Smoke test installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'target/packages/*.exe' | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList @('/S', '/D=C:\animathio-cli') -Wait
          & 'C:\animathio-cli\animathio-cli.exe' --version
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ matrix.subject }}
      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-${{ matrix.os }}
          path: target/packages/*
          if-no-files-found: error
