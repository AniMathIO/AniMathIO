name: Feature request
description: Suggest an improvement for AniMathIO 2.0
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The core is a simple video editor; math, text and effects belong in plugins. Please say
        which side your idea is on. The roadmap is [issue #156](https://github.com/AniMathIO/AniMathIO/issues/156).
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it belong
      options: [Core editor, Plugin (WASM component), CLI, MCP / control protocol, Importer, Docs, Not sure]
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or prior art
