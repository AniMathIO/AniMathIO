name: Bug report
description: Something in AniMathIO 2.0 (editor, CLI, MCP, plugins) does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problem? Do not file it here; see [SECURITY.md](https://github.com/AniMathIO/AniMathIO/blob/v2/SECURITY.md).
        This template is for AniMathIO 2.0. For the 1.x Electron app, say so in the title.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Output of `animathio --version`
      description: For a source build also give the commit (`git rev-parse --short HEAD`).
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, Windows, macOS, Other]
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: OS version, GPU and install method
      placeholder: "Arch Linux, RADV RX 6800, AppImage / deb / NSIS installer / dmg / cargo run"
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Editor, Timeline / playback, Rendering / preview, Export, Audio, Plugins, CLI, MCP / control protocol, Importers (v1, Manim), Subtitles / autocut, Installer / packaging, Other]
  - type: textarea
    id: project
    attributes:
      label: Project file or minimal repro
      description: Attach a `.amio` project (zip it) or a CLI command that reproduces it, if you can. Remove private media first.
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, errors
      render: shell
