# AniMathIO 2.0 — release-plz configuration (scoped to the `v2` branch).
#
# Current mode: RELEASE-PR ONLY. On every push to `v2`, release-plz opens a PR
# with the version bump + changelog, but it never tags, never creates a GitHub
# release and never publishes to crates.io.
#
# IMPORTANT (verified with a local `release-plz update` dry run): release-plz only
# opens a release PR for a package that already has a release to diff against. Crates
# are `publish = false`, so the release baseline is a git tag (`git_only = true` on the
# package below, enabled at the swap). Until the first `v2.0.0` tag exists, the workflow
# succeeds but opens NO release PR (`{"prs":[]}`). The tag is created by hand at the swap, see step 6 of
# docs/release-checklist.md; after that every release is a normal release PR.
#
# ---------------------------------------------------------------------------
# HOW TO ENABLE RELEASES (at the 2.0 swap, see issue #156 M5):
#   1. Ensure the workspace version in Cargo.toml is `2.0.0` (this is the
#      "starting at 2.0.0" step).
#   2. In the `[[package]]` block below, flip `git_tag_enable = true` and
#      `git_release_enable = true`. Keep them enabled on exactly ONE package so
#      the workspace keeps a single `vX.Y.Z` tag (internal crates get no tag).
#   3. In `.github/workflows/release-plz.yml`, uncomment the `release` job so
#      merging a release PR tags and creates the GitHub release.
#   4. Uncomment `git_only = true` in the `[[package]]` block, then bootstrap the
#      baseline: commit a generated CHANGELOG.md and tag `v2.0.0`
#      (docs/release-checklist.md, "Order of operations"). `release_always = false`
#      only releases merged release PRs, so the very first tag is not made by the bot.
# ---------------------------------------------------------------------------

[workspace]
# Never publish to crates.io: internal crates + apps ship only as installers.
publish = false
repo_url = "https://github.com/AniMathIO/AniMathIO"

# The changelog is generated by git-cliff from Conventional Commits. All rules
# (groups, hidden chore/ci noise, v2-only tag pattern) live in cliff.toml, which
# `git cliff` can also run standalone for a dry run.
changelog_config = "cliff.toml"
changelog_update = true
dependencies_update = true

# Releases are disabled until the 2.0 swap. These also mean internal crates get
# no per-crate tag: the canonical artifact below is the only package that ever
# overrides them.
git_tag_enable = false
git_release_enable = false

# Only release when the release PR is merged (never on every push).
release_always = false

# One canonical, user-facing artifact gets the single `vX.Y.Z` tag.
# Internal crates inherit `git_tag_enable = false` and get no per-crate tags.
#
# TODO(swap): when `apps/animathio` (the GPUI desktop app) lands and becomes the
# canonical artifact, point this block at `animathio` instead (or add it to the
# same version group), so the installer release is tagged, not the CLI.
[[package]]
name = "animathio-cli"
# `publish = false` packages only take part in a release in git-only mode: the
# previous release is found from the `v{{ version }}` tag instead of crates.io.
# ENABLE AT THE SWAP, together with the baseline tag: while no `v2.*` tag exists
# release-plz fails ("cargo metadata ... worktree") instead of doing nothing, which
# would turn the `release-plz` workflow red.
# git_only = true
# One changelog at the repository root (default would be apps/animathio-cli/CHANGELOG.md).
changelog_path = "CHANGELOG.md"
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"
# Releases are disabled until the 2.0 swap. Flip both to `true` to enable.
git_tag_enable = false
git_release_enable = false
