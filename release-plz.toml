# AniMathIO releases share one git baseline and one root changelog.

[workspace]
# Never publish to crates.io: internal crates + apps ship only as installers.
publish = false
# Nothing is published to crates.io, so API semver checks add nothing; with every
# member analyzed they also need the full native toolchain to build docs.
semver_check = false
# Analyze unpublished workspace members too: changelog_include only sees packages
# taking part in release analysis. All members compare against the same tag.
git_only = true
git_tag_name = "v{{ version }}"
repo_url = "https://github.com/AniMathIO/AniMathIO"

# The changelog is generated by git-cliff from Conventional Commits. All rules
# (groups, hidden chore/ci noise, v2-only tag pattern) live in cliff.toml, which
# `git cliff` can also run standalone for a dry run.
changelog_config = "cliff.toml"
changelog_update = false
dependencies_update = true

# Internal crates are analyzed, but only the canonical artifact creates a tag
# and GitHub release. Do not set release = false: that removes their histories.
git_tag_enable = false
git_release_enable = false

# Only release when the release PR is merged (never on every push).
release_always = false

# One canonical, user-facing artifact gets the single `vX.Y.Z` tag.
# Internal crates inherit `git_tag_enable = false` and get no per-crate tags.
[[package]]
name = "animathio-cli"
# One changelog at the repository root (default would be apps/animathio-cli/CHANGELOG.md).
changelog_path = "CHANGELOG.md"
changelog_update = true
# The CLI is the one tagged package, but the release covers the whole workspace:
# include commits that touch any workspace crate in its changelog.
changelog_include = ["animathio", "animathio-audio", "animathio-control", "animathio-core", "animathio-export", "animathio-format", "animathio-import-manim", "animathio-import-v1", "animathio-media", "animathio-plugin-api", "animathio-plugin-host", "animathio-render", "animathio-transcribe", "animathio-typeset"]
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"
# Only this package creates the shared tag and release.
git_tag_enable = true
git_release_enable = true
