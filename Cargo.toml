[workspace]
members = ["crates/*", "apps/*"]
exclude = ["spikes"]
resolver = "3"

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AniMathIO/AniMathIO"
publish = false

[workspace.dependencies]
animathio-core = { path = "crates/core" }
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
zip = { version = "6", default-features = false, features = ["deflate"] }
proptest = "1"
# GPUI Kit's GPUI distribution (lib name `gpui`); the editor uses gpui-component
# widgets on top of it. Version is pinned to the exact `gpui-pre` release that
# gpui-component 0.9.x requires, so the widget kit and the app share one GPUI.
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-component = "0.9.1"
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit", "wayland", "x11", "runtime_shaders"] }
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# Optimise dependencies in debug builds; the viewport spike showed ~9 fps without this.
[profile.dev.package."*"]
opt-level = 2

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Public fallible APIs share the crate's small error type.
missing_errors_doc = "allow"
