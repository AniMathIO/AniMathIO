[workspace]
members = ["crates/*", "apps/*"]
exclude = ["spikes"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AniMathIO/AniMathIO"
publish = false

[workspace.dependencies]
animathio-core = { path = "crates/core" }
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
zip = { version = "6", default-features = false, features = ["deflate"] }
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# Optimise dependencies in debug builds; the viewport spike showed ~9 fps without this.
[profile.dev.package."*"]
opt-level = 2

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Public fallible APIs share the crate's small error type.
missing_errors_doc = "allow"
