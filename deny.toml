# Dependency policy. Run scripts/check-advisories.sh for every tracked lockfile.
# Exceptions below are reviewed against the pinned dependency graph.

[licenses]
version = 2
# Symphonia and its sub-crates are MPL-2.0 (file-level copyleft); it is pulled in by
# filmcraft-codecs for MP3/FLAC/ALAC/HE-AAC and the MP4/MKV demux fallback.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception", # Wasmtime/Cranelift
    "ISC",
    "0BSD",
    "CC0-1.0",
    "NCSA", # libfuzzer-sys
    "MPL-2.0",
    "Zlib",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Unicode-3.0",
    "CDLA-Permissive-2.0", # webpki-roots (model downloads through ureq)
    "Unlicense", # whisper-rs / whisper-rs-sys (public-domain dedication)
]

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0320", reason = "yaml-rust is transitive via syntect in Typst; unmaintained notice, no vulnerability or compatible replacement. Retire with the upstream dependency." },
    { id = "RUSTSEC-2024-0384", reason = "instant is transitive in the GUI stack; maintenance-only notice, no vulnerability. Replacement requires upstream migration to web-time." },
    { id = "RUSTSEC-2024-0436", reason = "paste is used by transitive macros; maintenance-only notice, no vulnerability. Replacement requires upstream macro migration." },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is pulled by serde_yaml in the typesetting stack; maintenance-only notice, no vulnerability. Await upstream parser migration." },
    { id = "RUSTSEC-2025-0057", reason = "fxhash is transitive in the typesetting stack; maintenance-only notice, no vulnerability and no compatible replacement." },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile is transitive in GUI HTTP dependencies; maintenance-only notice, no vulnerability. Await upstream rustls-pki-types migration." },
    { id = "RUSTSEC-2025-0141", reason = "bincode is transitive in Typst; maintenance-only notice, no vulnerability. Format migration belongs upstream." },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is used directly and by font/layout dependencies; maintenance-only notice, no vulnerability. Replacing the font API requires a separate migration." },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz is transitive in text shaping; maintenance-only notice, no vulnerability. Await upstream harfrust migration." },
    { id = "RUSTSEC-2026-0370", reason = "zvariant 5 is required by the GPUI Linux D-Bus stack; maintenance-only notice. zbus 6 migration must happen upstream." },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names 4 is required by the GPUI Linux D-Bus stack; maintenance-only notice. zbus 6 migration must happen upstream." },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5 is required by the GPUI Linux D-Bus stack; maintenance-only notice. zbus 6 migration must happen upstream." },
    { id = "RUSTSEC-2025-0052", reason = "async-std exists only in the historical unshipped viewport spike via gpui 0.2.2; maintenance-only notice, no vulnerability." },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 exists only in the historical unshipped viewport spike; maintenance-only build-time macro notice." },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils exists only in the historical unshipped viewport spike; maintenance-only notice, no vulnerability." },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.38 is pinned by citationberg 0.7 via Typst. MathWorld denies all external files and accepts only a generated math source, so attacker-supplied CSL/XML is inaccessible. No compatible patched release." },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.38 is pinned by citationberg 0.7 via Typst. MathWorld denies all external files; namespace parsing of attacker-supplied CSL/XML is inaccessible. No compatible patched release." },
    { id = "RUSTSEC-2026-0235", reason = "rkyv 0.7 is pinned by mitex-spec 0.2.4. MiTeX reads only its compile-time embedded default command specification; user input is LaTeX text, never archive bytes. No compatible patched release." },
    { id = "GHSA-38c5-483c-4qqp", reason = "grid 0.18 is pinned by taffy 0.9 via gpui 0.2.2 only in the unshipped viewport spike. Taffy uses Grid::new/from_vec and rebuilds storage in expand_to_fit_range; it never calls expand_rows. Shipped workspace has no grid dependency. Reassess on spike dependency changes." },
]
