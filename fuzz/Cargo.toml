[workspace]

[package]
name = "animathio-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
animathio-core = { path = "../crates/core" }
animathio-format = { path = "../crates/format" }
animathio-import-manim = { path = "../crates/import-manim" }
animathio-import-v1 = { path = "../crates/import-v1" }
animathio-media = { path = "../crates/media" }
serde_json = "1"

[[bin]]
name = "project_json"
path = "fuzz_targets/project_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "project_amio"
path = "fuzz_targets/project_amio.rs"
test = false
doc = false
bench = false

[[bin]]
name = "v1_import"
path = "fuzz_targets/v1_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manim_source"
path = "fuzz_targets/manim_source.rs"
test = false
doc = false
bench = false

[[bin]]
name = "media_probe"
path = "fuzz_targets/media_probe.rs"
test = false
doc = false
bench = false
