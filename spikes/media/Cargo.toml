# Standalone spike crate. The empty [workspace] table opts this project out
# of the root workspace (which another agent is creating in parallel).
[package]
name = "animathio-media-spike"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
filmcraft-codecs = "0.9.0"
filmcraft-h264 = "0.9.0"
filmcraft-h264enc = "0.9.0"
filmcraft-isobmff = "0.9.0"
filmcraft-matroska = "0.9.0"
filmcraft-media = "0.9.0"
filmcraft-frame = "0.9.0"
filmcraft-aac = "0.9.0"
filmcraft-opus = "0.9.0"
filmcraft-time = "0.9.0"
thiserror = "2"
log = "0.4"
env_logger = "0.11"

[profile.dev]
debug = "line-tables-only"
